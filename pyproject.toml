[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-alphazero"
version = "0.1.0"
description = "Reproducible study of Leaf, Root, Tree and asynchronous batched MCTS"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "torch==2.9.1",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
az-study = "azparallel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/azparallel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B019"]  # Bounded memoization of immutable game states is intentional.

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
